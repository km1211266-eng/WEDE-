<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kwacha Coffee Roasters | Contact</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="site-header">
        <div class="logo">Kwacha Coffee Roasters</div>
        <nav class="main-nav">
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Our Roasts</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
                <li><a href="faq.html">FAQ</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="page-header">
            <h1>Get In Touch</h1>
        </section>

        <section class="content-block">
            <h2>Visit the Roastery</h2>
            <p>123 Roaster Street, Johannesburg, South Africa</p>
            <p>Open Tuesday – Saturday, 8am – 4pm</p>
        </section>

        <section class="content-block">
            <h2>Send Us an Enquiry</h2>
            <form action="#" method="post" class="enquiry-form">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>

                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>

                <label for="message">Message</label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="cta-button">Send Enquiry</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2026 Kwacha Coffee Roasters. All rights reserved.</p>
    </footer>

</body>
</html>
